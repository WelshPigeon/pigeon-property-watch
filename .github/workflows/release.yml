name: Release

# Push a tag such as v2.0.0 to publish a release. The tag must match the version in fxmanifest.lua,
# and CHANGELOG.md must have a section for it; its text becomes the release notes.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      - name: Run tests
        run: |
          lua5.4 tests/core.test.lua
          lua5.4 tests/resource.test.lua

      - name: Check the tag matches fxmanifest.lua
        run: |
          manifest=$(sed -n "s/^version '\(.*\)'$/\1/p" fxmanifest.lua)
          [ "v$manifest" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match fxmanifest.lua version $manifest"; exit 1; }

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md section for $version"; exit 1; }

      - name: Build pigeon-property-watch.zip
        run: git archive --format=zip --prefix=pigeon-property-watch/ -o pigeon-property-watch.zip "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pigeon-property-watch.zip --title "Pigeon Property Watch $GITHUB_REF_NAME" --notes-file notes.md
